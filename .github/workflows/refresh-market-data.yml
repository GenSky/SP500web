name: Refresh market data

on:
  schedule:
    # Weekdays after the US market close. GitHub schedules use UTC.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh quotes and charts
        run: npm run refresh:free-all

      - name: Build refreshed site
        run: npm run build

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- src/data/freeMarketData.ts src/data/freeChartData.ts src/data/strategyHistory.json; then
            echo "Market snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/freeMarketData.ts src/data/freeChartData.ts src/data/strategyHistory.json
          git commit -m "Refresh market data"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
